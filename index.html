<!DOCTYPE html>
<html>
<head>
  <title>My Online Portfolio</title>
  <meta charset = "UTF-8">
  <meta name = "viewport" content ="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
/*page style*/
 body {
      font-family: Times New Roman, sans-serif;
font-size: 18px;
      color: #222222;
      text-align: center;
      margin: 0;
      padding: 50px 25px;
    }
 
    h1 {
      color: #FF0145;
font-size: 44px;
      margin-bottom: 8px;
    }
 
    h2 {
font-size: 28px;
      margin-top: 60px;
    }
 
    p {
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* chart*/
    .chart-container {
      width:90%;
      max-width:700px;
      margin:20px auto;
    }
  </style>
</head>

<body>

<! title/intro>
  <h1>Nicholas Rubiera</h1>
  <p>Welcome to my Resume accurate portfolio! </p>

<! photos>
  <div class="image">
    <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkfWpDjpyQp6Zs8haKmOEhkwjQ9BAcPAWzmcWSDhJnbA&s">
    <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkfWpDjpyQp6Zs8haKmOEhkwjQ9BAcPAWzmcWSDhJnbA&s">
      </div>

<! chart 1 - line chart>
<h2>Look at this chart:</h2>
      <div class = "chart-container">
        <canvas id="chart1"></canvas>
      </div>
<! chart 2 - bar graph>
<h2>Look at this other chart:</h2>
<div class = "chart-container">
        <canvas id="chart2"></canvas>
      </div>

<!design choices paragraph>
<p>

</p>

      
    <script>
//chart 1: line chart
      const ctx1=document.getElementById("chart1");
     const labels1 = ["September", "October", "November", "December", "January"];
    const data1 = {
      labels: labels1,
      datasets: [{
        label: "Internships Applied",
        data: [2, 6, 5, 5, 0],
        fill: true,
        borderColor: "#FF0145",
        backgroundColor: "#FFD9E2",
        borderWidth: 2,
        tension: 0.35,
        pointRadius: 5,
        pointBackgroundColor: "#FF0145"
      }]
    };

const config1 = {
type:"line",
data:data1,
};

new Chart (ctx1, config1)

// chart 2: bar chart
 const ctx2 = document.getElementById("chart2");

const labels2 = ["September", "October", "November", "December", "January"];
const data2 = {
        labels: labels2,
        datasets: [{
          label: "Average Hours of sleep (Fall Semester)",
          data: [9, 7, 6, 6, 5],
         backgroundColor: [
 "rgba(255, 179, 193, 0.6)",
          "rgba(255, 107, 138, 0.6)",
          "rgba(255, 1, 69, 0.6)",
          "rgba(179, 0, 47, 0.6)",
          "rgba(92, 0, 22, 0.6)"        ],
        borderColor: [
          "rgb(255, 179, 193)",
          "rgb(255, 107, 138)",
          "rgb(255, 1, 69)",
          "rgb(179, 0, 47)",
          "rgb(92, 0, 22)"
        ],
        borderWidth: 2
      }]
    };

const config2 = {
      type: "bar",
      data: data2,
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    };

new Chart(ctx2, config2);
    </script>
</body>
</html>
